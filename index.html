<!doctype html>
<html lang="en">
  <head>
    <title>Lernprogramm</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/default.css" rel="stylesheet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="js/main.js" type="module"></script>
    <!-- <meta name="ROBOTS" content="INDEX, FOLLOW"/> search engine & indexing (maybe in the future)-->
    <noscript>
      JavaScript is currently disable. The webside might not work properly.
    </noscript>
  </head>
  <body>
    <header>Header</header>
    <div id="prac_area">
      <nav>
        <h2 class="heading">Navigation</h2>
        <ul>
          <li>
            <input name="kategorie" type="radio" id="quotes" />
            <label for="quotes">Quotes</label>
          </li>
          <li>
            <input name="kategorie" type="radio" id="mathe" />
            <label for="mathe">Mathematik</label>
          </li>
          <li>
            <input name="kategorie" type="radio" id="noten" />
            <label for="noten">Noten</label>
          </li>
        </ul>
      </nav>
      <main>
        <div id="question">Question</div>
        <div id="answer_button">
          <button type="button" id="button_a">A</button>
          <button type="button" id="button_b">B</button>
          <button type="button" id="button_c">C</button>
          <button type="button" id="button_d">D</button>
        </div>
      </main>
      <aside>
        <h2 class="heading">Statistics</h2>
        <progress id="stat_bar" value="0" max="0"></progress>
        <p id="wrong">0</p>
      </aside>
    </div>
    <footer>Footer</footer>
  </body>
</html>
