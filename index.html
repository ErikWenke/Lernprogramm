<!doctype html>
<html lang="en">
  <head>
    <title>Lernprogramm</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/katex.min.css"
      integrity="sha384-zB1R0rpPzHqg7Kpt0Aljp8JPLqbXI3bhnPWROx27a9N0Ll6ZP/+DiW/UqRcLbRjq"
      crossorigin="anonymous"
    />
    <link href="css/default.css" rel="stylesheet" />
    <link rel="manifest" href="data/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script src="js/main.js" type="module"></script>
    <!--- abcjs --->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.3/dist/abcjs-basic-min.js"></script>
    <!-- KaTex -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/katex.min.js"
      integrity="sha384-y23I5Q6l+B6vatafAwxRu/0oK/79VlbSz7Q9aiSZUvyWYIYsd+qj+o24G5ZU2zJz"
      crossorigin="anonymous"
    ></script>
    <!-- Auto Render KaTex -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/contrib/auto-render.min.js"
      integrity="sha384-kWPLUVMOks5AQFrykwIup5lo0m3iMkkHrD0uJ4H5cjeGihAutqP0yW0J6dpFiVkI"
      crossorigin="anonymous"
      onload="renderMathInElement(document.body);"
    ></script>
    <!-- <meta name="ROBOTS" content="INDEX, FOLLOW"/> search engine & indexing (maybe in the future)-->
    <noscript>
      JavaScript is currently disable. The webside might not work properly.
    </noscript>
  </head>
  <body>
    <header>Header</header>
    <div id="prac_area">
      <nav>
        <h2 class="heading">Navigation</h2>
        <ul>
          <li>
            <input name="kategorie" type="radio" id="quotes" />
            <label for="quotes">Quotes</label>
          </li>
          <li>
            <input name="kategorie" type="radio" id="mathe" />
            <label for="mathe">Mathematik</label>
          </li>
          <li>
            <input name="kategorie" type="radio" id="noten" />
            <label for="noten">Noten</label>
          </li>
          <li>
            <input name="kategorie" type="radio" id="bouldering" />
            <label for="bouldering">Bouldering</label>
          </li>
        </ul>
      </nav>
      <main id="flashcard">
        <div id="question_wrapper">
          <p id="question">Question</p>
        </div>
        <div id="answer_button">
          <button type="button" id="button_a">A</button>
          <button type="button" id="button_b">B</button>
          <button type="button" id="button_c">C</button>
          <button type="button" id="button_d">D</button>
        </div>
      </main>
      <aside>
        <h2 class="heading">Statistics</h2>
        <progress id="stat_bar" value="0" max="0"></progress>
        <p id="wrong">0</p>
      </aside>
    </div>
    <footer>Footer</footer>
  </body>
</html>
